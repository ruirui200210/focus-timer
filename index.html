<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>专注计时器</title>
<link rel="manifest" href="./manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system;background:#121212;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.timer{font-size:5rem;font-weight:bold;margin-bottom:40px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{border:none;padding:14px 28px;font-size:16px;border-radius:10px;cursor:pointer}
#start{background:#4ade80;color:#000}
#pause{background:#facc15;color:#000}
#reset{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div class="timer" id="time">25:00</div>
<div class="btns">
<button id="start">开始</button>
<button id="pause">暂停</button>
<button id="reset">重置</button>
</div>

<script>
let total=25*60,t=total,timer=null;
const el=document.getElementById('time');
const startBtn=document.getElementById('start');
const pauseBtn=document.getElementById('pause');
const resetBtn=document.getElementById('reset');

function fmt(s){
  const m=Math.floor(s/60);
  const sec=s%60;
  return String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
}

function render(){el.innerText=fmt(t)}

startBtn.onclick=()=>{
  if(timer) return;
  timer=setInterval(()=>{
    t--;render();
    if(t<=0){clearInterval(timer);timer=null}
  },1000)
}

pauseBtn.onclick=()=>{clearInterval(timer);timer=null}

resetBtn.onclick=()=>{clearInterval(timer);timer=null;t=total;render()}

render();
</script>
</body>
</html>
